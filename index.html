<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semak Terjemahan Al-Quran</title>
  <style>
    :root {
      --bg: #020617;
      --text: #e5e7eb;
      --subtext: #9ca3af;
      --border-soft: #1f2937;
      --border-mid: #4b5563;
      --grad1: #6366f1;
      --grad2: #8b5cf6;
      --danger: #f97373;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: radial-gradient(circle at top, #020617 0, #020617 40%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 820px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 18px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      padding: 32px 40px;
      backdrop-filter: blur(18px);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      color: var(--text);
    }
    .sub {
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    code {
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      color: #a5b4fc;
      font-family: monospace;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-mid);
      background: rgba(15,23,42,0.9);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      margin-bottom: 16px;
      line-height: 1.7;
    }
    textarea:focus { border-color: var(--grad1); box-shadow: 0 0 0 1px rgba(99,102,241,0.4); }

    .btn {
      width: 100%;
      border-radius: 999px;
      padding: 12px 16px;
      border: 1px solid transparent;
      background-image: linear-gradient(var(--bg), var(--bg)), linear-gradient(135deg, var(--grad1), var(--grad2));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(79,70,229,0.35);
      transition: transform 0.1s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background-image: none;
      background: rgba(15,23,42,0.9);
      border-color: var(--border-mid);
      box-shadow: none;
      width: auto;
      padding: 6px 16px;
      font-size: 0.85rem;
    }
    .btn-secondary:hover { background: rgba(15,23,42,1); }

    #read-screen { display: none; }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 10px;
    }
    #counter {
      font-size: 0.8rem;
      color: var(--subtext);
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .verse-card {
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: rgba(15,23,42,0.6);
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .verse-card:hover { border-color: var(--border-mid); }
    .verse-card.active {
      border-color: var(--grad1);
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 1px rgba(99,102,241,0.2);
    }
    .verse-num {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .verse-card.active .verse-num { color: var(--grad1); }
    .verse-text {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text);
      outline: none;
    }
    .verse-text:focus {
      background: rgba(99,102,241,0.06);
      border-radius: 6px;
      padding: 2px 6px;
      margin: -2px -6px;
    }

    #hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--subtext);
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
      opacity: 0.7;
    }
    kbd {
      background: rgba(15,23,42,0.9);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text);
    }

    #verse-list { max-height: 65vh; overflow-y: auto; padding-right: 4px; }
    #verse-list::-webkit-scrollbar { width: 5px; }
    #verse-list::-webkit-scrollbar-track { background: transparent; }
    #verse-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.5); border-radius: 10px; }
  </style>
</head>
<body>
<div class="card">

  <div id="paste-screen">
    <h1>Semak Terjemahan Al-Quran</h1>
    <p class="sub">Tampal terjemahan bernombor. Format: <code>1. Segala puji...</code> kemudian baris kosong <code>2. Apa saja...</code></p>
    <textarea id="paste-area" placeholder="Tampal terjemahan di sini..."></textarea>
    <button class="btn" id="start-btn">Mula Semak →</button>
  </div>

  <div id="read-screen">
    <div id="topbar">
      <button class="btn btn-secondary" id="btn-back">← Tampal semula</button>
      <span id="counter">Ayat 1 / 1</span>
    </div>
    <div id="verse-list"></div>
    <div id="hint">
      <kbd>←</kbd> Sebelumnya &nbsp;&nbsp; <kbd>→</kbd> Seterusnya &nbsp;&nbsp; Klik teks untuk edit
    </div>
  </div>

</div>
<script>
  let verses = [], cur = 0;

  function parseVerses(text) {
    const blocks = text.split(/\n\n+/).map(b => b.trim()).filter(Boolean);
    const result = [];
    for (const block of blocks) {
      const m = block.match(/^(\d+)[\.\)]\s*([\s\S]+)/);
      if (m) result.push({ num: parseInt(m[1]), text: m[2].trim() });
    }
    if (!result.length) {
      for (const line of text.split('\n').filter(l => l.trim())) {
        const m = line.match(/^(\d+)[\.\)]\s*(.+)/);
        if (m) result.push({ num: parseInt(m[1]), text: m[2].trim() });
      }
    }
    return result;
  }

  function renderVerses() {
    const list = document.getElementById('verse-list');
    list.innerHTML = '';
    verses.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'verse-card' + (i === cur ? ' active' : '');
      card.id = 'v' + i;

      const numEl = document.createElement('div');
      numEl.className = 'verse-num';
      numEl.textContent = 'Ayat ' + v.num;

      const textEl = document.createElement('div');
      textEl.className = 'verse-text';
      textEl.contentEditable = 'true';
      textEl.textContent = v.text;
      textEl.addEventListener('input', () => { verses[i].text = textEl.textContent; });
      textEl.addEventListener('focus', () => { cur = i; updateActive(); });
      textEl.addEventListener('click', e => e.stopPropagation());

      card.addEventListener('click', () => { cur = i; updateActive(); textEl.focus(); });
      card.appendChild(numEl);
      card.appendChild(textEl);
      list.appendChild(card);
    });
    scrollToCurrent();
  }

  function updateActive() {
    document.querySelectorAll('.verse-card').forEach((c, i) => {
      c.className = 'verse-card' + (i === cur ? ' active' : '');
    });
    document.getElementById('counter').textContent = 'Ayat ' + verses[cur].num + ' / ' + verses.length;
  }

  function scrollToCurrent() {
    const el = document.getElementById('v' + cur);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function update() { updateActive(); scrollToCurrent(); }

  document.getElementById('start-btn').addEventListener('click', () => {
    const text = document.getElementById('paste-area').value.trim();
    if (!text) return;
    verses = parseVerses(text);
    if (!verses.length) { alert('Tiada ayat bernombor dijumpai.'); return; }
    cur = 0;
    document.getElementById('paste-screen').style.display = 'none';
    document.getElementById('read-screen').style.display = 'block';
    renderVerses();
    update();
  });

document.getElementById('btn-back').addEventListener('click', () => {
    const updatedText = verses.map(v => v.num + '. ' + v.text).join('\n\n');
    document.getElementById('paste-area').value = updatedText;
    document.getElementById('read-screen').style.display = 'none';
    document.getElementById('paste-screen').style.display = 'block';
  });

  document.addEventListener('keydown', e => {
    if (document.getElementById('read-screen').style.display === 'none') return;
    if (document.activeElement?.contentEditable === 'true') return;
    if (e.key === 'ArrowRight') { if (cur < verses.length - 1) { cur++; update(); } }
    if (e.key === 'ArrowLeft')  { if (cur > 0) { cur--; update(); } }
  });
</script>
</body>
</html>
