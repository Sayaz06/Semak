<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semak Terjemahan Al-Quran</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #e8e8e8;
      color: #1a1a1a;
      min-height: 100vh;
      padding: 32px 16px;
    }

    /* ── PAGE (Google Docs feel) ── */
    .page {
      max-width: 820px;
      margin: 0 auto;
      background: #fff;
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      padding: 56px 72px;
      min-height: 80vh;
    }

    h1 {
      font-size: 26px;
      font-weight: 400;
      color: #333;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 14px;
      color: #777;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    code {
      background: #f4f4f4;
      border: 1px solid #e0e0e0;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: monospace;
    }

    textarea#paste-area {
      width: 100%;
      min-height: 260px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      color: #1a1a1a;
      line-height: 1.7;
      outline: none;
      margin-bottom: 16px;
    }
    textarea#paste-area:focus { border-color: #1a73e8; }

    .btn-primary {
      padding: 10px 28px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary:hover { background: #1557b0; }

    .btn-ghost {
      padding: 8px 18px;
      background: transparent;
      color: #555;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-ghost:hover { background: #f5f5f5; }

    /* ── READ SCREEN ── */
    #read-screen { display: none; }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
      flex-wrap: wrap;
      gap: 10px;
    }
    #counter {
      font-size: 15px;
      color: #555;
      font-weight: 400;
    }

    /* ── VERSE CARDS ── */
    .verse-card {
      padding: 16px 20px;
      border-left: 4px solid transparent;
      border-radius: 0 6px 6px 0;
      margin-bottom: 12px;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }
    .verse-card:hover { background: #f9f9f9; }
    .verse-card.active {
      border-left-color: #1a73e8;
      background: #f0f6ff;
    }
    .verse-num {
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .verse-card.active .verse-num { color: #1a73e8; }
    .verse-text {
      font-size: 17px;
      line-height: 1.8;
      color: #2c2c2c;
      outline: none;
    }
    .verse-text:focus {
      background: #fffde7;
      border-radius: 3px;
      padding: 2px 4px;
      margin: -2px -4px;
    }

    #hint {
      text-align: center;
      font-size: 12px;
      color: #bbb;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }
    kbd {
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-bottom-width: 2px;
      border-radius: 3px;
      padding: 1px 7px;
      font-size: 12px;
      font-family: monospace;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #2c2c2c; }
      .page { background: #1e1e1e; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
      h1 { color: #e0e0e0; }
      .sub { color: #999; }
      textarea#paste-area { background: #2a2a2a; border-color: #444; color: #e0e0e0; }
      .verse-text { color: #d8d8d8; }
      .verse-card:hover { background: #252525; }
      .verse-card.active { background: #0d2440; border-left-color: #4a9eff; }
      .verse-card.active .verse-num { color: #4a9eff; }
      #counter { color: #999; }
      #topbar { border-color: #333; }
      #hint { border-color: #333; color: #555; }
      kbd { background: #2a2a2a; border-color: #555; color: #ccc; }
      .btn-ghost { color: #aaa; border-color: #444; }
      .btn-ghost:hover { background: #2a2a2a; }
      code { background: #2a2a2a; border-color: #444; color: #ccc; }
      .verse-text:focus { background: #2a2400; }
    }
  </style>
</head>
<body>
<div class="page">

  <div id="paste-screen">
    <h1>Semak Terjemahan Al-Quran</h1>
    <p class="sub">
      Tampal terjemahan bernombor. Format: <code>1. Segala puji...</code> &nbsp; kemudian baris kosong &nbsp; <code>2. Apa saja...</code>
    </p>
    <textarea id="paste-area" placeholder="Tampal terjemahan di sini..."></textarea>
    <button class="btn-primary" id="start-btn">Mula Semak &rarr;</button>
  </div>

  <div id="read-screen">
    <div id="topbar">
      <button class="btn-ghost" id="btn-back">&#8592; Tampal semula</button>
      <span id="counter">Ayat 1 / 1</span>
    </div>
    <div id="verse-list"></div>
    <div id="hint">
      <kbd>&larr;</kbd> Sebelumnya &nbsp;&nbsp; <kbd>&rarr;</kbd> Seterusnya &nbsp;&nbsp;
      Klik teks ayat untuk edit terus
    </div>
  </div>

</div>

<script>
  let verses = [];
  let cur = 0;

  function parseVerses(text) {
    const blocks = text.split(/\n\n+/).map(b => b.trim()).filter(Boolean);
    const result = [];
    for (const block of blocks) {
      const m = block.match(/^(\d+)[\.\)]\s*([\s\S]+)/);
      if (m) result.push({ num: parseInt(m[1]), text: m[2].trim() });
    }
    if (!result.length) {
      const lines = text.split('\n').filter(l => l.trim());
      for (const line of lines) {
        const m = line.match(/^(\d+)[\.\)]\s*(.+)/);
        if (m) result.push({ num: parseInt(m[1]), text: m[2].trim() });
      }
    }
    return result;
  }

  function renderVerses() {
    const list = document.getElementById('verse-list');
    list.innerHTML = '';
    verses.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'verse-card' + (i === cur ? ' active' : '');
      card.id = 'v' + i;

      const numEl = document.createElement('div');
      numEl.className = 'verse-num';
      numEl.textContent = 'Ayat ' + v.num;

      const textEl = document.createElement('div');
      textEl.className = 'verse-text';
      textEl.contentEditable = 'true';
      textEl.textContent = v.text;

      textEl.addEventListener('input', () => { verses[i].text = textEl.textContent; });
      textEl.addEventListener('focus', () => { cur = i; updateActive(); });
      textEl.addEventListener('click', (e) => { e.stopPropagation(); cur = i; updateActive(); });

      card.addEventListener('click', () => { cur = i; updateActive(); textEl.focus(); });

      card.appendChild(numEl);
      card.appendChild(textEl);
      list.appendChild(card);
    });
    scrollToCurrent();
  }

  function updateActive() {
    document.querySelectorAll('.verse-card').forEach((c, i) => {
      c.className = 'verse-card' + (i === cur ? ' active' : '');
    });
    document.getElementById('counter').textContent =
      'Ayat ' + verses[cur].num + ' / ' + verses.length;
  }

  function scrollToCurrent() {
    const el = document.getElementById('v' + cur);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function update() {
    updateActive();
    scrollToCurrent();
  }

  document.getElementById('start-btn').addEventListener('click', () => {
    const text = document.getElementById('paste-area').value.trim();
    if (!text) return;
    verses = parseVerses(text);
    if (!verses.length) { alert('Tiada ayat bernombor dijumpai. Sila semak format.'); return; }
    cur = 0;
    document.getElementById('paste-screen').style.display = 'none';
    document.getElementById('read-screen').style.display = 'block';
    renderVerses();
    update();
  });

  document.getElementById('btn-back').addEventListener('click', () => {
    document.getElementById('read-screen').style.display = 'none';
    document.getElementById('paste-screen').style.display = 'block';
  });

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('read-screen').style.display === 'none') return;
    if (document.activeElement && document.activeElement.contentEditable === 'true') return;
    if (e.key === 'ArrowRight') { if (cur < verses.length - 1) { cur++; update(); } }
    if (e.key === 'ArrowLeft')  { if (cur > 0) { cur--; update(); } }
  });
</script>
</body>
</html>
